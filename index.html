<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="今日油价 — 全国 31 个省级行政区汽柴油零售价，每日自动更新。">
<meta name="theme-color" content="#f97316" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛽</text></svg>">
<title>今日油价 · 全国各省汽柴油价格</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1e293b;
    --text-dim: #64748b;
    --border: #e2e8f0;
    --accent: #f97316;
    --accent-soft: #fff7ed;
    --hi: #f97316;
    --hi-bg: #fff7ed;
    --zebra: #fafbfc;
    --shadow: 0 1px 3px rgba(15, 23, 42, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --border: #334155;
      --accent: #fb923c;
      --accent-soft: #2d1f10;
      --hi: #fdba74;
      --hi-bg: #2d2013;
      --zebra: #223046;
      --shadow: 0 1px 3px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding-bottom: 48px;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 14px; }

  header.hero {
    background: linear-gradient(135deg, #ea580c 0%, #f97316 55%, #fb923c 100%);
    color: #fff;
    padding: 26px 0 30px;
    border-radius: 0 0 22px 22px;
  }
  .hero h1 { font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .hero .sub { margin-top: 6px; font-size: 13px; opacity: .92; }
  .hero .sub .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #4ade80; margin-right: 5px; vertical-align: 1px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: -16px 0 4px; }
  .stat {
    background: var(--card);
    border-radius: 14px;
    padding: 10px 6px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .stat .label { font-size: 12px; color: var(--text-dim); }
  .stat .value { font-size: 20px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .stat .unit { font-size: 11px; color: var(--text-dim); font-weight: 400; }

  .toolbar { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 12px 0 8px; }
  .search {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 15px;
    outline: none;
    box-shadow: var(--shadow);
  }
  .search:focus { border-color: var(--accent); }

  section.region { margin-top: 14px; }
  .region h2 {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 600;
    padding: 4px 2px 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .region h2::before { content: ""; width: 4px; height: 13px; border-radius: 2px; background: var(--accent); }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
    font-variant-numeric: tabular-nums;
  }
  th, td { padding: 9px 6px; text-align: center; font-size: 14px; }
  thead th {
    background: var(--accent-soft);
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  tbody tr:nth-child(even) { background: var(--zebra); }
  td.prov { text-align: left; padding-left: 12px; font-weight: 600; white-space: nowrap; }
  td.hi { color: var(--hi); background: var(--hi-bg); font-weight: 700; }
  thead th.hi { color: var(--accent); }
  td.na { color: var(--text-dim); opacity: .55; }

  .msg {
    margin-top: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 16px;
    text-align: center;
    color: var(--text-dim);
  }
  .msg button {
    margin-top: 12px;
    padding: 8px 22px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }

  footer { margin-top: 28px; text-align: center; font-size: 12px; color: var(--text-dim); line-height: 1.9; }
  footer a { color: var(--text-dim); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>⛽ 今日油价</h1>
    <div class="sub"><span class="dot"></span>数据更新于 <span id="updated">加载中…</span></div>
  </div>
</header>

<div class="wrap">
  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input class="search" id="search" type="search" placeholder="🔍 搜索省份，如：广东 / 新疆" autocomplete="off">
  </div>

  <div id="content"><div class="msg">正在加载油价数据…</div></div>

  <footer>
    单位：元/升 · 数据每日 06:20 / 22:20（北京时间）自动更新<br>
    数据来源 <a href="https://github.com/ZhangHowie/oilpulse-cn" target="_blank" rel="noopener">OilPulse-CN</a> ·
    <a id="repo-link" href="https://github.com/liuyuhang888/today-oil-price" target="_blank" rel="noopener">GitHub 仓库</a>
  </footer>
</div>

<script>
(function () {
  var REPO_OWNER = 'liuyuhang888';
  var REPO_NAME = 'today-oil-price';
  var UPSTREAM_OWNER = 'ZhangHowie';
  var UPSTREAM_REPO = 'oilpulse-cn';

  // 数据源优先级：本站（Pages 同源）→ 自己仓库 CDN → 上游仓库 CDN/raw
  var SOURCES = [
    'data/latest.json',
    'https://cdn.jsdelivr.net/gh/' + REPO_OWNER + '/' + REPO_NAME + '@main/data/latest.json',
    'https://fastly.jsdelivr.net/gh/' + REPO_OWNER + '/' + REPO_NAME + '@main/data/latest.json',
    'https://cdn.jsdelivr.net/gh/' + UPSTREAM_OWNER + '/' + UPSTREAM_REPO + '@main/data/latest.json',
    'https://fastly.jsdelivr.net/gh/' + UPSTREAM_OWNER + '/' + UPSTREAM_REPO + '@main/data/latest.json',
    'https://raw.githubusercontent.com/' + UPSTREAM_OWNER + '/' + UPSTREAM_REPO + '/main/data/latest.json?t=' + Date.now()
  ];

  var REGION_ORDER = ['华北', '东北', '华东', '华中', '华南', '西南', '西北'];
  var REGIONS = {
    '华北': ['北京', '天津', '河北', '山西', '内蒙古'],
    '东北': ['辽宁', '吉林', '黑龙江'],
    '华东': ['上海', '江苏', '浙江', '安徽', '福建', '江西', '山东'],
    '华中': ['河南', '湖北', '湖南'],
    '华南': ['广东', '广西', '海南'],
    '西南': ['重庆', '四川', '贵州', '云南', '西藏'],
    '西北': ['陕西', '甘肃', '青海', '宁夏', '新疆']
  };

  function fmtTime(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function priceCell(v) {
    var n = parseFloat(v);
    return (isNaN(n) || n <= 0)
      ? '<td class="na">—</td>'
      : '<td>' + n.toFixed(2) + '</td>';
  }

  function render(data, keyword) {
    var provinces = data.provinces || {};
    var kw = (keyword || '').trim();
    var used = {};

    // 全国均价
    var sums = {}, counts = {};
    ['t0', 't89', 't92', 't95', 't98'].forEach(function (t) { sums[t] = 0; counts[t] = 0; });
    Object.keys(provinces).forEach(function (p) {
      ['t0', 't89', 't92', 't95', 't98'].forEach(function (t) {
        var v = parseFloat(provinces[p][t]);
        if (!isNaN(v) && v > 0) { sums[t] += v; counts[t]++; }
      });
    });
    var statsEl = document.getElementById('stats');
    statsEl.innerHTML = [['t92', '92# 汽油'], ['t95', '95# 汽油'], ['t98', '98# 汽油'], ['t0', '0# 柴油']]
      .map(function (x) {
        var avg = counts[x[0]] ? (sums[x[0]] / counts[x[0]]).toFixed(2) : '—';
        return '<div class="stat"><div class="label">' + x[1] + '</div>' +
          '<div class="value">' + avg + '<span class="unit"> 元</span></div></div>';
      }).join('');

    var html = '';
    REGION_ORDER.forEach(function (region) {
      var rows = '';
      REGIONS[region].forEach(function (p) {
        used[p] = true;
        var d = provinces[p];
        if (!d) return;
        if (kw && p.indexOf(kw) === -1) return;
        rows += '<tr><td class="prov">' + esc(p) + '</td>' +
          priceCell(d.t92) + '<td class="hi">' + priceCell(d.t95).replace(/<\/?td[^>]*>/g, '') + '</td>' +
          priceCell(d.t98) + priceCell(d.t0) + priceCell(d.t89) + '</tr>';
      });
      if (rows) html += '<section class="region"><h2>' + region + '</h2><table>' +
        '<thead><tr><th style="text-align:left;padding-left:12px">省份</th><th>92#</th><th class="hi">95#</th><th>98#</th><th>0# 柴油</th><th>89#</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></section>';
    });

    // 兜底：不在分区表里的省份也展示
    var extra = '';
    Object.keys(provinces).forEach(function (p) {
      if (used[p]) return;
      if (kw && p.indexOf(kw) === -1) return;
      var d = provinces[p];
      extra += '<tr><td class="prov">' + esc(p) + '</td>' +
        priceCell(d.t92) + priceCell(d.t95) + priceCell(d.t98) + priceCell(d.t0) + priceCell(d.t89) + '</tr>';
    });
    if (extra) html += '<section class="region"><h2>其他</h2><table>' +
      '<thead><tr><th style="text-align:left;padding-left:12px">省份</th><th>92#</th><th>95#</th><th>98#</th><th>0# 柴油</th><th>89#</th></tr></thead>' +
      '<tbody>' + extra + '</tbody></table></section>';

    if (!html) html = '<div class="msg">没有找到与「' + esc(kw) + '」匹配的省份</div>';
    document.getElementById('content').innerHTML = html;
  }

  function fail() {
    document.getElementById('updated').textContent = '加载失败';
    document.getElementById('content').innerHTML =
      '<div class="msg">油价数据加载失败，请检查网络后重试。<br><button onclick="location.reload()">重新加载</button></div>';
  }

  var cachedData = null;
  function load(i) {
    if (i >= SOURCES.length) return fail();
    fetch(SOURCES[i]).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (data) {
      if (!data || !data.provinces) throw new Error('bad data');
      cachedData = data;
      document.getElementById('updated').textContent = fmtTime(data.updated_at);
      render(data, '');
    }).catch(function () { load(i + 1); });
  }

  document.getElementById('search').addEventListener('input', function (e) {
    if (cachedData) render(cachedData, e.target.value);
  });

  load(0);
})();
</script>
</body>
</html>
